name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 packages
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: yarn install --frozen-lockfile

      - name: Check release version
        id: version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cargoJson = cargo metadata --manifest-path src-tauri/Cargo.toml --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the Cargo package metadata.' }
          $cargo = ($cargoJson | ConvertFrom-Json).packages | Where-Object { $_.name -eq 'fish-notes' }
          if ($package.version -cne $tauri.version -or $package.version -cne $cargo.version) {
            throw "Version mismatch (package.json: $($package.version), tauri.conf.json: $($tauri.version), Cargo.toml: $($cargo.version))."
          }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -cne "v$($package.version)") {
            throw "Release tag $env:GITHUB_REF_NAME must match v$($package.version)."
          }
          "version=$($package.version)" >> $env:GITHUB_OUTPUT

      - name: Build NSIS installer
        run: npx tauri build --target x86_64-pc-windows-msvc -- --locked

      - name: Collect installer and package the portable executable
        shell: pwsh
        env:
          FISH_NOTES_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $releaseDir = 'src-tauri/target/x86_64-pc-windows-msvc/release'
          $installer = @(Get-ChildItem "$releaseDir/bundle/nsis" -File -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw "Expected one NSIS installer, found $($installer.Count)." }
          $portable = Get-Item "$releaseDir/fish-notes.exe"
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item -LiteralPath $installer[0].FullName -Destination release-assets
          $zip = "release-assets/Fish-Notes-${env:FISH_NOTES_VERSION}-windows-x64-portable.zip"
          Compress-Archive -LiteralPath $portable.FullName -DestinationPath $zip -CompressionLevel Optimal
          Get-ChildItem release-assets | Select-Object Name, Length | Format-Table

      - name: Upload Windows packages to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            release-assets/*-setup.exe
            release-assets/*-windows-x64-portable.zip

      - name: Upload Windows packages to Actions
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Fish-Notes-${{ steps.version.outputs.version }}-windows-x64
          path: release-assets/
          if-no-files-found: error

  macos:
    name: macOS compatibility build
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
      - run: yarn install --frozen-lockfile
      - run: npx tauri build --no-bundle -- --locked
