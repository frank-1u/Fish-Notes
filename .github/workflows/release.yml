name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 packages
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: yarn install --frozen-lockfile

      - name: Check release version
        id: version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cargoJson = cargo metadata --manifest-path src-tauri/Cargo.toml --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the Cargo package metadata.' }
          $cargo = ($cargoJson | ConvertFrom-Json).packages | Where-Object { $_.name -eq 'fish-notes' }
          if ($package.version -cne $tauri.version -or $package.version -cne $cargo.version) {
            throw "Version mismatch (package.json: $($package.version), tauri.conf.json: $($tauri.version), Cargo.toml: $($cargo.version))."
          }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -cne "v$($package.version)") {
            throw "Release tag $env:GITHUB_REF_NAME must match v$($package.version)."
          }
          "version=$($package.version)" >> $env:GITHUB_OUTPUT

      - name: Build NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target x86_64-pc-windows-msvc -- --locked

      - name: Collect installer and package the portable executable
        shell: pwsh
        env:
          FISH_NOTES_VERSION: ${{ steps.version.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $releaseDir = 'src-tauri/target/x86_64-pc-windows-msvc/release'
          $installer = @(Get-ChildItem "$releaseDir/bundle/nsis" -File -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw "Expected one NSIS installer, found $($installer.Count)." }
          $portable = Get-Item "$releaseDir/fish-notes.exe"
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item -LiteralPath $installer[0].FullName -Destination release-assets
          $sigPath = "$($installer[0].FullName).sig"
          if (Test-Path -LiteralPath $sigPath) {
            Copy-Item -LiteralPath $sigPath -Destination release-assets
            $signature = (Get-Content -LiteralPath $sigPath -Raw).Trim()
            $assetName = $installer[0].Name
            $encodedName = [System.Uri]::EscapeDataString($assetName)
            $manifest = [ordered]@{
              version   = $env:FISH_NOTES_VERSION
              notes     = "Fish Notes v$($env:FISH_NOTES_VERSION)"
              pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = [ordered]@{
                'windows-x86_64' = [ordered]@{
                  signature = $signature
                  url       = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/v$($env:FISH_NOTES_VERSION)/$encodedName"
                }
              }
            }
            $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath 'release-assets/latest.json' -Encoding utf8NoBOM
          }
          $zip = "release-assets/Fish-Notes-${env:FISH_NOTES_VERSION}-windows-x64-portable.zip"
          Compress-Archive -LiteralPath $portable.FullName -DestinationPath $zip -CompressionLevel Optimal
          Get-ChildItem release-assets | Select-Object Name, Length | Format-Table

      - name: Upload Windows packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fish-Notes-${{ steps.version.outputs.version }}-windows-x64
          path: release-assets/
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: windows
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows packages artifact
        uses: actions/download-artifact@v4
        with:
          name: Fish-Notes-${{ needs.windows.outputs.version }}-windows-x64
          path: release-assets

      - name: Upload Windows packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            release-assets/*-setup.exe
            release-assets/*-setup.exe.sig
            release-assets/latest.json
            release-assets/*-windows-x64-portable.zip

  macos:
    name: macOS compatibility build
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: yarn install --frozen-lockfile
      - run: npx tauri build --no-bundle -- --locked
